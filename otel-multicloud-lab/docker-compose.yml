name: otel-multicloud-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - lab

  service-b:
    build:
      context: ./services/service-b
    environment:
      SERVICE_NAME: service-b
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/orders_db
      LOG_LEVEL: INFO
      OTEL_SERVICE_NAME: service-b
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=local,service.namespace=otel-multicloud-lab
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - lab

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped
    networks:
      - lab

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector/otel-collector.local.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped
    networks:
      - lab

  prometheus:
    image: prom/prometheus:v3.4.2
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped
    networks:
      - lab

  grafana:
    image: grafana/grafana-oss:12.4.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lab

  loki:
    image: grafana/loki:3.5.12
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - lab

  service-a:
    build:
      context: ./services/service-a
    environment:
      SERVICE_NAME: service-a
      SERVICE_B_URL: http://service-b:8080
      SERVICE_B_TIMEOUT_SECONDS: "5"
      LOG_LEVEL: INFO
      OTEL_SERVICE_NAME: service-a
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=local,service.namespace=otel-multicloud-lab
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    ports:
      - "8081:8080"
    depends_on:
      service-b:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - lab

  k6:
    image: grafana/k6:2.3.0
    profiles: ["benchmark"]
    user: "0:0"
    volumes:
      - ./load-tests:/scripts:ro
      - ./load-tests/results:/results
    environment:
      BASE_URL: http://service-a:8080
    networks:
      - lab

volumes:
  postgres_data:
    name: otel-multicloud-lab-postgres
  loki_data:
    name: otel-multicloud-lab-loki

networks:
  lab:
    name: otel-multicloud-lab
