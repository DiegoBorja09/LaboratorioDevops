global:
  scrape_interval: 5s
  scrape_timeout: 5s

scrape_configs:
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8889
  - job_name: otel-collector-internal
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8888
