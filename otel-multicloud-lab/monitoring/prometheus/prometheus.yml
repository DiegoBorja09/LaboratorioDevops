global:
  scrape_interval: 5s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/slo-rules.yml

scrape_configs:
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8889
  - job_name: otel-collector-internal
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8888
